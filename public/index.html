<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Salón Unicornio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: clay stage (3D unicorn) + candy tray of options. Portrait stacks 50/50, landscape splits left/right. */
:root{
  --stage:#9fdcd0;
  --tray:#fff4f7;
  --chip:#ffffff;
  --chip-edge:#f1cfdb;
  --ink:#3d2748;
  --ink-soft:#8d7396;
  --pink:#ff5d8f;
  --sun:#ffc94d;
  --sun-edge:#d99a12;
  --font-display:"Baloo 2","Chalkboard SE","Avenir Next Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Nunito","Avenir Next",system-ui,sans-serif;
  --sw:clamp(54px,9.4vmin,84px);
  --ov:22px;
  --cat-c:#ff6f9f;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--tray)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--tray);color:var(--ink);font-family:var(--font-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:14px}

.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
@media (orientation:portrait){body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--stage);z-index:10}}

/* ---------- Stage ---------- */
.stage{position:relative;min-height:0;min-width:0;background:var(--stage);overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:absolute;top:12px;display:flex;gap:10px;z-index:3}
.hud-l{left:calc(12px + env(safe-area-inset-left,0px))}
.hud-r{right:calc(12px + env(safe-area-inset-right,0px))}
.fab{appearance:none;border:0;cursor:pointer;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.86);color:var(--ink);box-shadow:0 4px 0 rgba(61,39,72,.16),0 8px 18px rgba(61,39,72,.12);transition:transform .12s}
.fab svg{width:26px;height:26px}
.fab:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 rgba(61,39,72,.16)}
.fab.wand{width:auto;height:56px;border-radius:28px;padding:0 18px 0 12px;display:flex;gap:6px;align-items:center;background:var(--sun);box-shadow:0 5px 0 var(--sun-edge),0 10px 22px rgba(160,100,0,.25);font:800 19px/1 var(--font-display);letter-spacing:.01em}
.fab.wand svg{width:34px;height:34px}
.fab.confirm{width:auto;border-radius:24px;padding:0 14px;background:var(--ink);color:#fff;font:800 15px/1 var(--font-display);gap:6px;display:flex;align-items:center}
.fab.confirm svg{width:20px;height:20px}
.hint{position:absolute;left:50%;bottom:calc(var(--ov) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--ink);color:#fff;font:700 16px/1.1 var(--font-display);white-space:nowrap;box-shadow:0 8px 20px rgba(61,39,72,.25);z-index:3;animation:hintbob 1.6s ease-in-out infinite;pointer-events:none}
.hint-ico{width:34px;height:34px;display:grid;place-items:center;background:#fff;border-radius:50%}
.hint-ico svg{width:28px;height:28px}
@keyframes hintbob{50%{transform:translate(-50%,-5px)}}
.veil{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:var(--stage);color:var(--ink);font:800 22px/1.2 var(--font-display);text-align:center;padding:0 24px;transition:opacity .5s}
.veil.gone{opacity:0;pointer-events:none}
.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--pink);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){background:var(--sun);animation-delay:.15s}
.dots i:nth-child(3){background:#8f7bff;animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-10px) scale(1.1)}}

/* ---------- Tray ---------- */
.tray{position:relative;z-index:2;min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px;margin-top:calc(var(--ov) * -1);border-radius:26px 26px 0 0;background:var(--tray);box-shadow:0 -8px 24px rgba(61,39,72,.10);padding-block:14px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (orientation:landscape){
  .app{grid-template-rows:100%;grid-template-columns:minmax(0,1.18fr) minmax(300px,1fr)}
  .tray{margin-top:0;margin-left:calc(var(--ov) * -1);border-radius:26px 0 0 26px;box-shadow:-8px 0 24px rgba(61,39,72,.10);padding-left:20px;padding-block:14px 8px}
  .hint{bottom:16px;left:calc(50% - var(--ov) / 2)}
  .hud-r{right:calc(var(--ov) + 12px)}
}

.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:none}
.cat{appearance:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;padding:7px 4px 5px;border-radius:18px;background:var(--c-soft);color:var(--c-deep);box-shadow:0 4px 0 var(--c-edge);transition:transform .12s,background .15s}
.cat svg{width:40px;height:40px}
.cat span{font:800 15px/1.15 var(--font-display);letter-spacing:.01em;white-space:nowrap}
.cat .dot{fill:var(--c-soft)}
.cat[aria-selected="true"] .dot{fill:var(--c-edge)}
.cat[aria-selected="true"]{background:var(--c);color:#fff;transform:translateY(2px);box-shadow:0 2px 0 var(--c-edge)}
.cat:active{transform:translateY(3px)}

.subs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:none;padding:2px 2px 6px;margin:0 -2px}
.subs::-webkit-scrollbar{display:none}
.pill{appearance:none;border:0;cursor:pointer;flex:none;padding:7px 16px 6px;border-radius:999px;background:var(--chip);color:var(--ink);font:700 17px/1.1 var(--font-display);box-shadow:0 3px 0 var(--chip-edge);transition:transform .12s}
.pill[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #22142b}
.pill:active{transform:translateY(2px)}

.opts{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding:4px 2px 16px;margin:0 -2px}
.group{display:flex;flex-direction:column;gap:8px}
.gtitle{font:800 12px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);padding-left:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--sw) + 12px),1fr));gap:12px 6px}
.tile{appearance:none;border:0;background:none;padding:6px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:11px;color:var(--ink);font:800 12px/1.1 var(--font-body);min-width:0}
.tile .nm{max-width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{position:relative;width:var(--sw);height:var(--sw);border-radius:50%;display:grid;place-items:center;background:var(--chip);box-shadow:0 4px 0 var(--chip-edge),inset 0 -6px 10px rgba(61,39,72,.06);transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s;overflow:hidden}
.sw svg{width:82%;height:82%}
.sw.paint{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8) 0 9%,rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 120%,rgba(0,0,0,.14),rgba(0,0,0,0) 60%),var(--p)}
.tile[aria-pressed="true"] .sw{transform:scale(1.06);box-shadow:0 0 0 4px var(--tray),0 0 0 8px var(--cat-c),0 4px 0 var(--chip-edge)}
.tile:active .sw{transform:scale(.9)}
.tile.sticker .sw svg{width:74%;height:74%;filter:drop-shadow(0 2px 2px rgba(61,39,72,.22))}
.sizes{display:flex;gap:10px;align-items:flex-end}
.size{appearance:none;border:0;cursor:pointer;background:var(--chip);border-radius:16px;box-shadow:0 3px 0 var(--chip-edge);display:grid;place-items:center;width:52px;height:46px;transition:transform .12s}
.size i{display:block;border-radius:50%;background:var(--cat-c)}
.size[aria-pressed="true"]{background:var(--ink)}
.size[aria-pressed="true"] i{background:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.act{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 16px 7px 12px;border-radius:999px;background:var(--chip);box-shadow:0 3px 0 var(--chip-edge);font:700 16px/1 var(--font-display);color:var(--ink)}
.act svg{width:22px;height:22px}
.act.warn{background:var(--ink);color:#fff;box-shadow:0 3px 0 #22142b}
.act:disabled{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

@media (max-height:520px){
  :root{--sw:clamp(46px,11vmin,60px)}
  .cat{padding:4px 4px 3px}
  .cat svg{width:28px;height:28px}
  .cat span{font-size:13px}
  .pill{font-size:15px;padding:6px 13px 5px}
  .fab.wand{height:48px;font-size:16px}
  .fab.wand svg{width:28px;height:28px}
}
@media (max-width:420px) and (orientation:portrait){
  .cat span{font-size:12px;letter-spacing:0}
  .cat{padding-inline:2px}
  .fab.wand span{display:none}
  .fab.wand{padding:0 11px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="stage" id="stage" aria-label="Unicornio">
    <canvas id="c" aria-label="Unicornio de plastilina en 3D. Arrastra para girarlo."></canvas>
    <div class="hud hud-l">
      <button class="fab wand" id="btnWand" aria-label="Sorpresa: cambia todo al azar">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 40 31 18" stroke="#3d2748" stroke-width="5" stroke-linecap="round"/><path d="M9 40 22 27" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M34 4l2.6 7.4L44 14l-7.4 2.6L34 24l-2.6-7.4L24 14l7.4-2.6z" fill="#fff" stroke="#3d2748" stroke-width="2.5" stroke-linejoin="round"/><circle cx="43" cy="28" r="2.6" fill="#ff5d8f"/><circle cx="20" cy="9" r="2.2" fill="#ff5d8f"/></svg>
        <span>Sorpresa</span>
      </button>
    </div>
    <div class="hud hud-r">
      <button class="fab" id="btnSound" aria-label="Sonido" aria-pressed="true"></button>
      <button class="fab" id="btnFull" aria-label="Pantalla completa" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      </button>
      <button class="fab" id="btnReset" aria-label="Empezar de nuevo"></button>
    </div>
    <div class="hint" id="hint" hidden><span class="hint-ico" id="hintIco"></span><span id="hintTxt">Toca el unicornio para pegar</span></div>
    <div class="veil" id="veil"><div><div id="veilTxt">Amasando la plastilina…</div><div class="dots"><i></i><i></i><i></i></div></div></div>
  </section>
  <section class="tray" id="tray" aria-label="Opciones">
    <nav class="cats" id="cats" role="tablist" aria-label="Categorías"></nav>
    <div class="subs" id="subs" role="tablist"></div>
    <div class="opts" id="opts"></div>
  </section>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = (s)=>document.querySelector(s);
const veil=$('#veil'), veilTxt=$('#veilTxt');
if(typeof THREE==='undefined'){ veilTxt.textContent='No se pudo cargar el 3D. Revisa la conexión y vuelve a abrir la página.'; veil.querySelector('.dots').remove(); return; }
if(THREE.ColorManagement && 'legacyMode' in THREE.ColorManagement) THREE.ColorManagement.legacyMode=false;

/* ================= utils ================= */
const TAU=Math.PI*2, D2R=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
const hx=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const toHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);};
const rgba=(h,a)=>{const c=hx(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`;};
const lum=h=>{const c=hx(h);return(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;};
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= 2D shapes (100-unit box) ================= */
const circ=(cx,cy,r)=>`M${cx-r} ${cy}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0Z`;
const ell=(cx,cy,rx,ry)=>`M${cx-rx} ${cy}a${rx} ${ry} 0 1 0 ${2*rx} 0a${rx} ${ry} 0 1 0 ${-2*rx} 0Z`;
const starP=(cx,cy,R,r,n=5,rot=-Math.PI/2)=>{let d='';for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,rr=i%2?r:R;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(2)+' '+(cy+Math.sin(a)*rr).toFixed(2);}return d+'Z';};
const band=(cx,cy,ro,ri)=>`M${cx-ro} ${cy}A${ro} ${ro} 0 0 1 ${cx+ro} ${cy}L${cx+ri} ${cy}A${ri} ${ri} 0 0 0 ${cx-ri} ${cy}Z`;
const HEART='M50 88C22 68 6 50 6 33C6 18 17 8 30 8C39 8 46 13 50 21C54 13 61 8 70 8C83 8 94 18 94 33C94 50 78 68 50 88Z';
const STAR=starP(50,54,47,21);
const PETALS=[0,1,2,3,4].map(i=>{const a=-Math.PI/2+i*TAU/5;return circ(+(50+Math.cos(a)*25).toFixed(2),+(50+Math.sin(a)*25).toFixed(2),19);}).join('');
const SPARK='M50 4C54 36 64 46 96 50C64 54 54 64 50 96C46 64 36 54 4 50C36 46 46 36 50 4Z';
const RAINBOW=['#ff6b81','#ffa44f','#ffd84d','#6fd68f','#5cb8f5','#a17cf0'];
const PASTEL=['#ffb3cf','#c9b3ff','#a8e1ff','#b5f0d3','#fff0a6'];

const STICKERS=[
  {id:'estrella',name:'Estrella',L:[[STAR,'#ffd447'],[circ(38,46,4.5)+circ(60,46,4.5),'#3d2748'],[ell(50,58,6,3.5),'#ff7aa6']]},
  {id:'corazon',name:'Corazón',L:[[HEART,'#ff5d8f']]},
  {id:'arcoiris',name:'Arcoíris',L:[...RAINBOW.map((c,i)=>[band(50,74,46-i*6,40-i*6),c]),[circ(12,76,9)+circ(23,80,8)+circ(77,80,8)+circ(88,76,9),'#ffffff']]},
  {id:'luna',name:'Luna',L:[['M64 8A44 44 0 1 0 92 76A37.5 37.5 0 1 1 64 8Z','#ffe07a']]},
  {id:'flor',name:'Flor',L:[[PETALS,'#ff8fc8'],[circ(50,50,14),'#ffd447']]},
  {id:'mariposa',name:'Mariposa',L:[[ell(31,38,20,22)+ell(69,38,20,22),'#b18cff'],[ell(34,69,15,15)+ell(66,69,15,15),'#ff8fc8'],[circ(29,36,6)+circ(71,36,6),'#ffe7f5'],[ell(50,54,5.5,28)+circ(43,17,4)+circ(57,17,4),'#5b3f7a']]},
  {id:'brillo',name:'Brillo',L:[[SPARK,'#fff0a0'],['M82 4C83 13 86 16 96 18C86 20 83 23 82 32C81 23 78 20 68 18C78 16 81 13 82 4Z','#ffb3d9']]},
  {id:'nube',name:'Nube',L:[[circ(30,60,18)+circ(52,46,24)+circ(73,58,18)+'M30 78H73V60H30Z','#d4ecff'],[circ(42,58,3.5)+circ(62,58,3.5),'#3d2748'],[ell(35,66,4.5,2.6)+ell(69,66,4.5,2.6),'#ff9cc0']]},
  {id:'fresa',name:'Fresa',L:[['M50 94C26 84 12 62 16 44C19 31 33 27 50 32C67 27 81 31 84 44C88 62 74 84 50 94Z','#ff4d6d'],['M50 34L33 20L45 23L50 7L55 23L67 20Z','#3cb371'],[[[36,50],[50,47],[64,50],[42,64],[58,64],[50,79],[29,62],[71,62]].map(([x,y])=>ell(x,y,2.6,3.8)).join(''),'#ffe08a']]},
  {id:'rayo',name:'Rayo',L:[['M60 4L22 56H46L36 96L80 40H55L68 4Z','#ffd43b']]},
  {id:'diamante',name:'Diamante',L:[['M28 16H72L94 40L50 94L6 40Z','#6fd9ff'],['M28 16L38 40H62L72 16Z','#c4f3ff'],['M6 40H38L50 94Z','#45bde9']]},
  {id:'helado',name:'Helado',L:[['M30 52L50 96L70 52Z','#f2b366'],[circ(50,40,23),'#ff9cc8'],[circ(50,13,7),'#ff3b5c'],[ell(40,34,3,1.6)+ell(58,30,3,1.6)+ell(52,46,3,1.6),'#ffffff']]},
];
const STK={};STICKERS.forEach(s=>{STK[s.id]=s;s.paths=s.L.map(([d,f])=>[new Path2D(d),f]);s.all=new Path2D(s.L.map(l=>l[0]).join(' '));});

  {id:'lila',name:'Lila',c:'#c3a5f6'},{id:'cielo',name:'Cielo',c:'#9fd5f7'},{id:'nacar',name:'Nácar',c:'#fff7f0'},
  {id:'arcoiris',name:'Arcoíris',tex:'rainbow'},{id:'primarios',name:'Primarios',tex:'primary'},{id:'estrellas',name:'Estrellas',tex:'stars'},
  {id:'caramelo',name:'Caramelo',tex:'candy'},{id:'purpurina',name:'Purpurina',tex:'glitter'},

const EYE=[

  {id:'ambar',name:'Ámbar',c:'#ee9b2f'},{id:'turquesa',name:'Turquesa',c:'#1fbdb8'},{id:'cafe',name:'Café',c:'#8a5636'},{id:'rubi',name:'Rubí',c:'#e0364d'},

function makeNoiseCanvas(){

  for(let i=0;i<240;i++){
    const px=r()*S,py=r()*S,rad=10+r()*46,v=r()<.5?255:0,a=.04+r()*.06;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const X=px+dx*S,Y=py+dy*S;if(X<-rad||X>S+rad||Y<-rad||Y>S+rad)continue;const g=x.createRadialGradient(X,Y,0,X,Y,rad);g.addColorStop(0,`rgba(${v},${v},${v},${a})`);g.addColorStop(1,`rgba(${v},${v},${v},0)`);x.fillStyle=g;x.fillRect(X-rad,Y-rad,rad*2,rad*2);}
  }

  for(let i=0;i<9;i++){const cx=r()*S,cy=r()*S,a0=r()*TAU;for(let k=0;k<9;k++){x.strokeStyle=`rgba(${k%2?255:0},${k%2?255:0},${k%2?255:0},.07)`;x.beginPath();x.ellipse(cx,cy,6+k*3.2,4+k*2.4,a0,0,Math.PI*1.4);x.stroke();}}

}

  else if(id==='brillos')j=[[38,31,'#ff7ac0'],[37,23,'#7fe6ff'],[34,16,'#c9a7ff']].map(([x,y,c])=>`<path d="M${x} ${y-4}l3 4-3 4-3-4z" fill="${c}" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`).join('');
  else if(id==='perlas')j=[[39,34],[38,27],[36,20],[33,14]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="#fffaf4" stroke="#d9c8c0" stroke-width="1"/>`).join('');
  else if(id==='estrella')j=tr(STAR,33,20,.14,'#ffd447',`stroke="${INK}" stroke-width="8"`);
  else if(id==='corazon')j=tr(HEART,33,20,.13,'#ff4f8b',`stroke="${INK}" stroke-width="8"`);
  else if(id==='flor')j=tr(PETALS,33,20,.15,'#ff8fc8',`stroke="${INK}" stroke-width="7"`)+`<circle cx="33" cy="20" r="2.2" fill="#ffd447"/>`;
  return sv(EAR+j);
}
const MUZ=`<ellipse cx="32" cy="36" rx="24" ry="17" fill="#ffe3ea" stroke="${INK}" stroke-width="2"/><ellipse cx="23" cy="32" rx="4" ry="2.8" fill="#c8869d" transform="rotate(20 23 32)"/><ellipse cx="41" cy="32" rx="4" ry="2.8" fill="#c8869d" transform="rotate(-20 41 32)"/><path d="M24 43q8 5 16 0" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
function noseSVG(id){
  let j='';if(id==='aro-oro'||id==='aro-plata')j=`<circle cx="46" cy="34" r="5" fill="none" stroke="${id==='aro-oro'?'#e2a92c':'#a9b2c3'}" stroke-width="3"/>`;
  else if(id==='brillo')j=`<path d="M47 23l4.5 5-4.5 6-4.5-6z" fill="#7fe6ff" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>`;
  else if(id==='estrella')j=tr(STAR,47,28,.15,'#ffd447',`stroke="${INK}" stroke-width="8"`);
  return sv(MUZ+j);
}
function glassesSVG(id){
  if(id==='redondas')return sv(`<circle cx="19" cy="34" r="11" fill="#e4f4ff" stroke="#ff5d8f" stroke-width="4"/><circle cx="45" cy="34" r="11" fill="#e4f4ff" stroke="#ff5d8f" stroke-width="4"/><path d="M30 32q2-4 4 0" stroke="#ff5d8f" stroke-width="3.5" fill="none" stroke-linecap="round"/>`);
  if(id==='corazon')return sv(tr(HEART,18,34,.26,'#ffd6e2',`stroke="#ff3f6c" stroke-width="15"`)+tr(HEART,46,34,.26,'#ffd6e2',`stroke="#ff3f6c" stroke-width="15"`)+`<path d="M29 30q3-3 6 0" stroke="#ff3f6c" stroke-width="3.5" fill="none" stroke-linecap="round"/>`);
  if(id==='estrella')return sv(tr(STAR,18,34,.28,'#fff6c8',`stroke="#ffbf1f" stroke-width="13" stroke-linejoin="round"`)+tr(STAR,46,34,.28,'#fff6c8',`stroke="#ffbf1f" stroke-width="13" stroke-linejoin="round"`)+`<path d="M29 31q3-3 6 0" stroke="#ffbf1f" stroke-width="3.5" fill="none" stroke-linecap="round"/>`);
  if(id==='gato')return sv(`<path d="M28 31c0-4-4-5-10-5L7 22c-1 8 3 19 12 19 6 0 9-5 9-10zM36 31c0-4 4-5 10-5l11-4c1 8-3 19-12 19-6 0-9-5-9-10z" fill="#efe3ff" stroke="#8a4fe6" stroke-width="3.6" stroke-linejoin="round"/><path d="M29 31q3-3 6 0" stroke="#8a4fe6" stroke-width="3.5" fill="none" stroke-linecap="round"/>`);
  if(id==='arcoiris')return sv([['#ff6b81',11],['#ffd84d',8.2],['#5cb8f5',5.6]].map(([c,r])=>`<circle cx="19" cy="34" r="${r}" fill="none" stroke="${c}" stroke-width="2.8"/><circle cx="45" cy="34" r="${r}" fill="none" stroke="${c}" stroke-width="2.8"/>`).join('')+`<path d="M30 32q2-4 4 0" stroke="#ff6b81" stroke-width="3.5" fill="none" stroke-linecap="round"/>`);
  if(id==='flor')return sv(tr(PETALS,18,34,.27,'#ffe0ef',`stroke="#ff7ab8" stroke-width="12"`)+tr(PETALS,46,34,.27,'#ffe0ef',`stroke="#ff7ab8" stroke-width="12"`)+`<path d="M29 32q3-3 6 0" stroke="#ff7ab8" stroke-width="3.5" fill="none" stroke-linecap="round"/>`);
  if(id==='cuadradas')return sv(`<rect x="8" y="24" width="21" height="19" rx="5" fill="#dcfaf3" stroke="#1fb39b" stroke-width="4"/><rect x="35" y="24" width="21" height="19" rx="5" fill="#dcfaf3" stroke="#1fb39b" stroke-width="4"/><path d="M29 31q3-3 6 0" stroke="#1fb39b" stroke-width="3.5" fill="none" stroke-linecap="round"/>`);
  if(id==='sol')return sv(`<path d="M7 27h20c0 9-3 15-10 15S7 36 7 27zM37 27h20c0 9-3 15-10 15s-10-6-10-15z" fill="#2b2433" stroke="#2b2433" stroke-width="3" stroke-linejoin="round"/><path d="M27 28q5-3 10 0" stroke="#2b2433" stroke-width="3.5" fill="none"/><path d="M11 31l4-3M41 31l4-3" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>`);
  return NONE_SVG;
}
function headSVG(id){
  const flowerS=(x,y,s,c)=>tr(PETALS,x,y,s,c,`stroke="${INK}" stroke-width="${3/s*0.5}"`)+`<circle cx="${x}" cy="${y}" r="${s*14}" fill="#ffd447"/>`;
  if(id==='lazo')return sv(`<path d="M30 30 10 18c-3-2-6 0-6 3v18c0 3 3 5 6 3l20-10zM34 30l20-12c3-2 6 0 6 3v18c0 3-3 5-6 3L34 32z" fill="#ff4f8b" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><rect x="27" y="25" width="10" height="12" rx="4" fill="#ff4f8b" stroke="${INK}" stroke-width="2"/>`);
  if(id==='flores')return sv(`<path d="M8 44Q32 24 56 44" stroke="#7bd389" stroke-width="3" fill="none" stroke-linecap="round"/>`+flowerS(14,38,.16,'#ff8fc8')+flowerS(32,30,.18,'#c9a7ff')+flowerS(50,38,.16,'#8fd9ff'));
  if(id==='tiara')return sv(`<path d="M8 46 12 26l9 10 11-18 11 18 9-10 4 20z" fill="#e3e7ef" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><circle cx="32" cy="18" r="4" fill="#ff5d9e" stroke="${INK}" stroke-width="1.6"/><circle cx="12" cy="26" r="3" fill="#ff5d9e"/><circle cx="52" cy="26" r="3" fill="#ff5d9e"/>`+tr(HEART,32,38,.12,'#ff5d9e'));
  if(id==='flor')return sv(flowerS(30,32,.4,'#ff8fc8')+flowerS(48,46,.2,'#ffffff'));
  return NONE_SVG;
}
function lipsSVG(o){
  const c=o.c||'#7a3e5c',w=o.c?6.5:3;
  return sv(`<ellipse cx="32" cy="32" rx="25" ry="19" fill="#ffe3ea"/><path d="M17 30q15 14 30 0" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>${o.glitter?'<circle cx="26" cy="35" r="1.4" fill="#fff"/><circle cx="36" cy="36" r="1.2" fill="#fff3a0"/><circle cx="31" cy="37" r="1" fill="#fff"/>':''}${o.c?'<path d="M24 33q8 5 16 0" stroke="#fff" stroke-width="1.6" fill="none" opacity=".6" stroke-linecap="round"/>':''}`);
}
function stickerSVG(def,mode){
  const all=def.L.map(l=>l[0]).join(' ');
  if(mode==='tatuaje')return `<svg viewBox="-6 -6 112 112" aria-hidden="true">${def.L.map(([d,f])=>`<path d="${d}" fill="${f}" fill-opacity=".8" stroke="#3a2a52" stroke-width="3.4" stroke-linejoin="round"/>`).join('')}</svg>`;
  return `<svg viewBox="-10 -10 120 120" aria-hidden="true"><path d="${all}" fill="#fff" stroke="#fff" stroke-width="15" stroke-linejoin="round"/>${def.L.map(([d,f])=>`<path d="${d}" fill="${f}"/>`).join('')}</svg>`;
}

const CATS=[
  {id:'maquillaje',name:'Maquillaje',col:['#ff6f9f','#ffe1ec','#f2b3c9','#c83c6c'],subs:[
    {id:'pestanas',name:'Pestañas',groups:[{key:'lashes',kind:'lash',deps:['lashColor','eye']},{key:'lashColor',kind:'paint',title:'Color de pestañas'}]},
    {id:'ojos',name:'Ojos',groups:[{key:'eye',kind:'paint',title:'Color de ojos'},{key:'lens',kind:'lens',title:'Lentes de contacto',deps:['eye']}]},
    {id:'sombras',name:'Sombras',groups:[{key:'shadow',kind:'paint'}]},
    {id:'rubor',name:'Rubor',groups:[{key:'blush',kind:'blush'}]},
    {id:'pecas',name:'Pecas',groups:[{key:'freckles',kind:'freckle'}]},
    {id:'labios',name:'Labios',groups:[{key:'lips',kind:'lips'}]},
  ]},
  {id:'accesorios',name:'Accesorios',col:['#9a7bff','#ece6ff','#cbbcf5','#5b3fc2'],subs:[
    {id:'aretes',name:'Aretes',groups:[{key:'earring',kind:'earring',title:'Abajo'},{key:'earTop',kind:'earTop',title:'Arriba'}]},
    {id:'nariz',name:'Nariz',groups:[{key:'nose',kind:'nose'}]},
    {id:'gafas',name:'Gafas',groups:[{key:'glasses',kind:'glasses'}]},
    {id:'cabeza',name:'Cabeza',groups:[{key:'headAcc',kind:'head'}]},
  ]},
  {id:'colores',name:'Colores',col:['#f2a516','#fff1c7','#f0d38a','#9a6100'],subs:[
    {id:'pelaje',name:'Pelaje',groups:[{key:'fur',kind:'paint'}]},
    {id:'pelo',name:'Pelo',groups:[{key:'hair',kind:'hair',title:'Peinado',deps:['mane']},{key:'mane',kind:'paint',title:'Color del pelo'}]},
    {id:'cuerno',name:'Cuerno',groups:[{key:'horn',kind:'paint'}]},
  ]},
  {id:'stickers',name:'Stickers',col:['#1fb39b','#d8f5ee','#9edccf','#0d7564'],subs:[{id:'sticker',name:'Stickers'},{id:'tatuaje',name:'Tatuajes'}]},
];
CATS.forEach(c=>{c.icon=ICON[c.id];});
const catOf=id=>CATS.find(c=>c.id===id)||CATS[0];
if(!CATS.some(c=>c.id===ui.cat))ui.cat='maquillaje';

function swInner(group,o){
  if(group.kind==='lash')return NONE.has(o.id)?NONE_SVG:lashSVG(o.id,byId(LASH_C,state.lashColor).c);
  if(group.kind==='lens')return eyeSVG(o.id,byId(EYE,state.eye).c);
  if(group.kind==='freckle')return NONE.has(o.id)?NONE_SVG:freckleSVG(o.id);
  if(group.kind==='hair')return hairSVG(o.id);
  if(group.kind==='earring')return NONE.has(o.id)?NONE_SVG:earringSVG(o.id);
  if(group.kind==='earTop')return NONE.has(o.id)?NONE_SVG:earTopSVG(o.id);
  if(group.kind==='nose')return NONE.has(o.id)?NONE_SVG:noseSVG(o.id);
  if(group.kind==='glasses')return glassesSVG(o.id);
  if(group.kind==='head')return headSVG(o.id);
  if(group.kind==='lips')return lipsSVG(o);
  if(group.kind==='blush'&&o.id==='corazones')return sv(tr(HEART,24,30,.22,o.c)+tr(HEART,42,40,.16,o.c)+tr(HEART,40,22,.12,o.c));
  if(NONE.has(o.id))return NONE_SVG;
  return '';
}
function tileHTML(group,o){
  const inner=swInner(group,o),sel=state[group.key]===o.id;
  const paint=!inner;
  const style=paint?` style="--p:${patternCSS(o)}"`:'';
  return `<button class="tile" data-key="${group.key}" data-id="${o.id}" aria-pressed="${sel}" aria-label="${o.name}"><span class="sw${paint?' paint':''}"${style}>${inner}</span><span class="nm">${o.name}</span></button>`;
}
function groupHTML(g){return `<div class="group" data-gkey="${g.key}">${g.title?`<div class="gtitle">${g.title}</div>`:''}<div class="grid">${CATALOG[g.key].map(o=>tileHTML(g,o)).join('')}</div></div>`;}
let visibleGroups=[];
function renderCats(){
  catsEl.innerHTML=CATS.map(c=>`<button class="cat" role="tab" data-cat="${c.id}" aria-selected="${ui.cat===c.id}" style="--c:${c.col[0]};--c-soft:${c.col[1]};--c-edge:${c.col[2]};--c-deep:${c.col[3]}">${c.icon}<span>${c.name}</span></button>`).join('');
  trayEl.style.setProperty('--cat-c',catOf(ui.cat).col[0]);
}
function renderSubs(){
  const c=catOf(ui.cat);if(!c.subs.some(s=>s.id===ui.sub[c.id]))ui.sub[c.id]=c.subs[0].id;
  subsEl.innerHTML=c.subs.map(s=>`<button class="pill" role="tab" data-sub="${s.id}" aria-selected="${ui.sub[c.id]===s.id}">${s.name}</button>`).join('');
}
function renderOpts(){
  const c=catOf(ui.cat);visibleGroups=[];
  if(c.id==='stickers'){renderStickers();return;}
  const s=c.subs.find(x=>x.id===ui.sub[c.id]);visibleGroups=s.groups;
  optsEl.innerHTML=s.groups.map(groupHTML).join('');optsEl.scrollTop=0;
}
function renderStickers(){
  const mode=ui.sub.stickers==='tatuaje'?'tatuaje':'sticker';
  const sizes=['s','m','l'].map((k,i)=>`<button class="size" data-size="${k}" aria-pressed="${ui.size===k}" aria-label="${['Pequeño','Mediano','Grande'][i]}"><i style="width:${12+i*8}px;height:${12+i*8}px"></i></button>`).join('');
  optsEl.innerHTML=`<div class="row"><div class="group"><div class="gtitle">Tamaño</div><div class="sizes">${sizes}</div></div><div class="actions" id="stkActs"></div></div>
  <div class="group"><div class="gtitle">${mode==='tatuaje'?'Elige un tatuaje y toca al unicornio':'Elige un sticker y toca al unicornio'}</div><div class="grid">${STICKERS.map(d=>`<button class="tile sticker" data-stk="${d.id}" aria-pressed="${ui.sticker===d.id}" aria-label="${d.name}"><span class="sw">${stickerSVG(d,mode)}</span><span class="nm">${d.name}</span></button>`).join('')}</div></div>`;
  refreshStickerActions();
}
let clearArmed=0;
function refreshStickerActions(){
  const el=$('#stkActs');if(!el)return;const n=state.stickers.length;
  el.innerHTML=`<button class="act" data-act="undo" ${n?'':'disabled'}>${ICON.undo}Deshacer</button><button class="act ${clearArmed?'warn':''}" data-act="clear" ${n?'':'disabled'}>${ICON.trash}${clearArmed?'¿Quitar todos?':'Quitar todos'}</button>`;
}
function refreshDeps(changed){
  for(const g of visibleGroups){if(!(g.deps||[]).includes(changed))continue;const el=optsEl.querySelector(`[data-gkey="${g.key}"]`);if(!el)continue;
    el.querySelectorAll('.tile').forEach(t=>{const o=byId(CATALOG[g.key],t.dataset.id);t.querySelector('.sw').innerHTML=swInner(g,o);});}
}
let hintSeen=false;
function updateHint(){
  const h=$('#hint');const on=ui.cat==='stickers'&&!hintSeen;h.hidden=!on;
  if(on){const mode=ui.sub.stickers==='tatuaje'?'tatuaje':'sticker';$('#hintIco').innerHTML=stickerSVG(STK[ui.sticker],mode);$('#hintTxt').textContent=mode==='tatuaje'?'Toca el unicornio para el tatuaje':'Toca el unicornio para pegar';}
}
catsEl.addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;if(ui.cat!==b.dataset.cat){ui.cat=b.dataset.cat;renderCats();renderSubs();renderOpts();saveUI();hintSeen=false;}updateHint();sfx.tab();});
subsEl.addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;ui.sub[ui.cat]=b.dataset.sub;renderSubs();renderOpts();saveUI();if(ui.cat==='stickers')hintSeen=false;updateHint();sfx.tab();b.scrollIntoView({inline:'nearest',block:'nearest'});});
optsEl.addEventListener('click',e=>{
  const t=e.target.closest('.tile[data-key]');
  if(t){const k=t.dataset.key,id=t.dataset.id;if(state[k]!==id){state[k]=id;apply(k);save();}
    t.parentElement.querySelectorAll('.tile').forEach(x=>x.setAttribute('aria-pressed',x===t));refreshDeps(k);sfx.pop();squash(.8);
    const target=k==='lashes'||k==='lashColor'||k==='eye'||k==='lens'||k==='shadow'?eyes[1].g:k==='horn'?hornG:k==='earring'||k==='earTop'?ears[1].g:k==='nose'||k==='lips'?muzzleMesh:k==='headAcc'||k==='hair'||k==='mane'?hornG:headMesh;
    const wp=new THREE.Vector3();target.getWorldPosition(wp);burst(wp.add(V3(0,0,.4)),7,.9);return;}
  const st=e.target.closest('[data-stk]');if(st){ui.sticker=st.dataset.stk;optsEl.querySelectorAll('[data-stk]').forEach(x=>x.setAttribute('aria-pressed',x===st));hintSeen=false;updateHint();sfx.pop();return;}
  const sz=e.target.closest('[data-size]');if(sz){ui.size=sz.dataset.size;optsEl.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',x===sz));sfx.tab();return;}
  const a=e.target.closest('[data-act]');if(a){
    if(a.dataset.act==='undo'){const s=state.stickers.pop();if(s){paintBy[s.m]();save();sfx.undo();}clearArmed=0;}
    else if(a.dataset.act==='clear'){if(!clearArmed){clearArmed=1;setTimeout(()=>{clearArmed=0;refreshStickerActions();},3000);}else{clearArmed=0;state.stickers=[];paintHead();paintMuzzle();paintNeck();save();sfx.magic();squash(1);}}
    refreshStickerActions();
  }
});

/* HUD */
const btnSound=$('#btnSound'),btnReset=$('#btnReset'),btnFull=$('#btnFull');
function paintSound(){btnSound.innerHTML=muted?ICON.soundOff:ICON.soundOn;btnSound.setAttribute('aria-pressed',String(!muted));btnSound.setAttribute('aria-label',muted?'Activar sonido':'Silenciar');}
btnSound.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem(KEY+'-mute',muted?'1':'0');}catch(e){}paintSound();sfx.tab();});
let resetArmed=0;
function paintReset(){btnReset.classList.toggle('confirm',!!resetArmed);btnReset.innerHTML=ICON.reset+(resetArmed?'<span>¿Empezar de nuevo?</span>':'');btnReset.setAttribute('aria-label',resetArmed?'Toca otra vez para empezar de nuevo':'Empezar de nuevo');}
btnReset.addEventListener('click',()=>{
  if(!resetArmed){resetArmed=1;paintReset();setTimeout(()=>{resetArmed=0;paintReset();},3000);sfx.tab();return;}
  resetArmed=0;state=JSON.parse(JSON.stringify(DEFAULT));applyAll();save();renderOpts();paintReset();sfx.magic();squash(1.3);tYaw=0;tPitch=0;burst(V3(0,.4,.9),24,1.6);
});
$('#btnWand').addEventListener('click',()=>{
  const r=(arr,noneP)=>{const o=arr.filter(x=>!NONE.has(x.id));return Math.random()<(noneP||0)?arr[0].id:pick(o).id;};
  Object.assign(state,{fur:r(FUR),mane:r(MANE),hair:r(HAIR),horn:r(HORN),eye:r(EYE),lens:Math.random()<.4?'normal':r(LENS),lashes:r(LASHES),lashColor:Math.random()<.5?'negro':r(LASH_C),shadow:r(SHADOW,.15),blush:r(BLUSH,.15),freckles:r(FRECKLES,.5),lips:r(LIPS),earring:r(EARRING,.35),earTop:r(EAR_TOP,.6),nose:r(NOSE,.6),glasses:r(GLASSES,.65),headAcc:r(HEADACC,.4)});
  applyAll();save();renderOpts();sfx.magic();squash(1.3);burst(V3(0,.5,.9),26,1.7);
});
const fsEl=document.documentElement;
if((fsEl.requestFullscreen||fsEl.webkitRequestFullscreen)&&(document.fullscreenEnabled||document.webkitFullscreenEnabled))btnFull.hidden=false;
btnFull.addEventListener('click',()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{const p=(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl);if(p&&p.catch)p.catch(()=>{btnFull.hidden=true;});}}catch(e){btnFull.hidden=true;}});

/* ================= boot ================= */
paintSound();paintReset();
applyAll();shadowAll(uni);
renderCats();renderSubs();renderOpts();updateHint();
layout();
requestAnimationFrame(frame);
window.__uni={state,apply,applyAll,ui,renderOpts,renderCats,renderSubs,camera,tap,hitTest};
})();
</script>
