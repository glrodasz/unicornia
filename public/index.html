<style>
/* Layout: clay stage (3D unicorn) + candy tray of options. Portrait stacks 50/50, landscape splits left/right. */
:root{
  --stage:#9fdcd0;
  --tray:#fff4f7;
  --chip:#ffffff;
  --chip-edge:#f1cfdb;
  --ink:#3d2748;
  --ink-soft:#8d7396;
  --pink:#ff5d8f;
  --sun:#ffc94d;
  --sun-edge:#d99a12;
  --font-display:"Baloo 2","Chalkboard SE","Avenir Next Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Nunito","Avenir Next",system-ui,sans-serif;
  --sw:clamp(54px,9.4vmin,84px);
  --ov:22px;
  --cat-c:#ff6f9f;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--tray);overflow:hidden;overscroll-behavior:none}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--tray);color:var(--ink);font-family:var(--font-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:14px}

.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
@media (orientation:portrait){body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--stage);z-index:10}}

/* ---------- Stage ---------- */
.stage{position:relative;min-height:0;min-width:0;background:var(--stage);overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:absolute;top:12px;display:flex;gap:10px;z-index:3}
.hud-l{left:calc(12px + env(safe-area-inset-left,0px))}
.hud-r{right:calc(12px + env(safe-area-inset-right,0px))}
.fab{appearance:none;border:0;cursor:pointer;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.86);color:var(--ink);box-shadow:0 4px 0 rgba(61,39,72,.16),0 8px 18px rgba(61,39,72,.12);transition:transform .12s}
.fab svg{width:30px;height:30px}
.fab:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 rgba(61,39,72,.16)}
.fab.wand{width:auto;height:60px;border-radius:30px;padding:0 20px 0 14px;display:flex;gap:6px;align-items:center;background:var(--sun);box-shadow:0 5px 0 var(--sun-edge),0 10px 22px rgba(160,100,0,.25);font:800 19px/1 var(--font-display);letter-spacing:.01em}
.fab.wand svg{width:34px;height:34px}
.fab.confirm{width:auto;border-radius:28px;padding:0 18px;background:var(--ink);color:#fff;font:800 15px/1 var(--font-display);gap:6px;display:flex;align-items:center}
.fab.confirm svg{width:20px;height:20px}
.hud-r:has(.confirm) .fab:not(.confirm){display:none}
.hint{position:absolute;left:50%;bottom:calc(var(--ov) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--ink);color:#fff;font:700 16px/1.1 var(--font-display);white-space:nowrap;box-shadow:0 8px 20px rgba(61,39,72,.25);z-index:3;animation:hintbob 1.6s ease-in-out infinite;pointer-events:none}
.hint-ico{width:34px;height:34px;display:grid;place-items:center;background:#fff;border-radius:50%}
.hint-ico svg{width:28px;height:28px}
@keyframes hintbob{50%{transform:translate(-50%,-5px)}}
/* Perfume bottle that follows the finger while spraying; the nozzle tip sits at --tx/--ty inside the box. */
.sprayer{position:absolute;left:0;top:0;width:76px;height:95px;z-index:3;pointer-events:none;transform-origin:7px 17px;filter:drop-shadow(0 6px 8px rgba(61,39,72,.25))}
.sprayer svg{width:100%;height:100%;display:block}
.sprayer .pump{transition:transform .06s}
.sprayer.psst .pump{transform:translateY(3px)}
/* Idle coach for perfume: a finger pressing and holding on the unicorn, with the bottle spraying. Origin = fingertip. */
.coach{position:absolute;left:0;top:0;width:0;height:0;z-index:3;pointer-events:none}
.coach>*{position:absolute}
.coach .ring{left:-32px;top:-32px;width:64px;height:64px;border-radius:50%;border:5px solid var(--ring,#e55bb0);opacity:0;animation:coachRing 2.4s ease-out infinite}
.coach .ring+.ring{animation-delay:.45s}
.coach .bottle{left:23px;top:9px;width:76px;height:95px;transform-origin:7px 17px;transform:rotate(-14deg);filter:drop-shadow(0 6px 8px rgba(61,39,72,.25));animation:coachFade 2.4s infinite}
.coach .bottle svg{width:100%;height:100%;display:block}
.coach .bottle .pump{animation:coachPump 2.4s infinite}
.coach .puff{left:22px;top:18px;width:22px;height:22px;border-radius:50%;background:var(--mist,#ffc2d1);opacity:0;animation:coachPuff 2.4s ease-out infinite}
.coach .puff:nth-of-type(2){animation-delay:.35s}.coach .puff:nth-of-type(3){animation-delay:.7s}
.coach .finger{left:-22px;top:-5px;width:84px;height:113px;transform-origin:22px 5px;animation:coachPress 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(61,39,72,.28))}
.coach.tap{--ring:#1fb39b}
.coach.tap .finger{animation-name:coachTap}
.coach.tap .ring{animation-name:coachTapRing}
.coach.tap .ring+.ring{animation-delay:.53s}
.coach .stk{left:-40px;top:-40px;width:80px;height:80px;opacity:0;animation:coachStk 2.4s infinite}
.coach .stk svg{width:100%;height:100%;display:block}
@keyframes coachTap{0%{transform:translate(26px,40px);opacity:0}14%{transform:translate(8px,14px);opacity:1}22%{transform:translate(0,0) scale(.92)}30%{transform:translate(5px,8px)}44%{transform:translate(0,0) scale(.92)}54%{transform:translate(8px,14px);opacity:1}68%,100%{transform:translate(26px,40px);opacity:0}}
@keyframes coachTapRing{0%,20%{opacity:0;transform:scale(.4)}24%{opacity:.9}42%,100%{opacity:0;transform:scale(1.7)}}
@keyframes coachStk{0%,22%{opacity:0;transform:scale(.2) rotate(-12deg)}30%{opacity:1;transform:scale(1.15) rotate(6deg)}36%,82%{opacity:1;transform:scale(1) rotate(0)}94%,100%{opacity:0;transform:scale(1)}}
@keyframes coachPress{0%{transform:translate(26px,40px);opacity:0}14%{transform:translate(8px,14px);opacity:1}28%,78%{transform:translate(0,0) scale(.92)}90%{transform:translate(8px,14px);opacity:1}100%{transform:translate(26px,40px);opacity:0}}
@keyframes coachRing{0%,28%{opacity:0;transform:scale(.4)}34%{opacity:.9}62%,100%{opacity:0;transform:scale(1.7)}}
@keyframes coachPump{0%,28%,80%,100%{transform:none}30%,78%{transform:translateY(3px)}}
@keyframes coachFade{0%,6%{opacity:0}16%,86%{opacity:1}96%,100%{opacity:0}}
@keyframes coachPuff{0%,30%{opacity:0;transform:translate(0,0) scale(.3)}36%{opacity:.85}54%,100%{opacity:0;transform:translate(-30px,-24px) scale(2.2)}}
/* Rotate coach: shown until the unicorn has been dragged once. JS slides the finger and turns the unicorn in sync; origin = fingertip. */
.spin{position:absolute;left:0;top:0;width:0;height:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s}
.spin.on{opacity:1}
.spin>*{position:absolute}
.spin .arc{left:-92px;top:-6px;width:184px;height:56px;filter:drop-shadow(0 4px 6px rgba(61,39,72,.22))}
.spin .arc svg,.spin .finger svg{width:100%;height:100%;display:block}
.spin .finger{left:-22px;top:-5px;width:84px;height:113px;filter:drop-shadow(0 6px 8px rgba(61,39,72,.28))}
.veil{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:var(--stage);color:var(--ink);font:800 22px/1.2 var(--font-display);text-align:center;padding:0 24px;transition:opacity .5s}
.veil.gone{opacity:0;pointer-events:none}
.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--pink);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){background:var(--sun);animation-delay:.15s}
.dots i:nth-child(3){background:#8f7bff;animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-10px) scale(1.1)}}

/* ---------- Tray ---------- */
.tray{position:relative;z-index:2;min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px;margin-top:calc(var(--ov) * -1);border-radius:26px 26px 0 0;background:var(--tray);box-shadow:0 -8px 24px rgba(61,39,72,.10);padding-block:14px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (orientation:landscape){
  .app{grid-template-rows:100%;grid-template-columns:minmax(0,1.18fr) minmax(300px,1fr)}
  .tray{margin-top:0;margin-left:calc(var(--ov) * -1);border-radius:26px 0 0 26px;box-shadow:-8px 0 24px rgba(61,39,72,.10);padding-left:20px;padding-block:14px 8px}
  .hint{bottom:16px;left:calc(50% - var(--ov) / 2)}
  .hud-r{right:calc(var(--ov) + 12px)}
}

.cats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;flex:none}
.cat{container-type:inline-size;appearance:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;padding:7px 4px 5px;border-radius:18px;background:var(--c-soft);color:var(--c-deep);box-shadow:0 4px 0 var(--c-edge);transition:transform .12s,background .15s}
.cat svg{width:40px;height:40px}
.cat span{font:800 min(14px,18cqi)/1.15 var(--font-display);letter-spacing:.01em;white-space:nowrap}
.cat .dot{fill:var(--c-soft)}
.cat[aria-selected="true"] .dot{fill:var(--c-edge)}
.cat[aria-selected="true"]{background:var(--c);color:#fff;transform:translateY(2px);box-shadow:0 2px 0 var(--c-edge)}
.cat:active{transform:translateY(3px)}

.subs{display:flex;flex-wrap:wrap;gap:8px;flex:none;padding:2px 2px 6px;margin:0 -2px}
.pill{appearance:none;border:0;cursor:pointer;flex:none;display:flex;align-items:center;gap:6px;min-height:48px;padding:6px 18px 5px 8px;border-radius:999px;background:var(--chip);color:var(--ink);font:700 18px/1.1 var(--font-display);box-shadow:0 3px 0 var(--chip-edge);transition:transform .12s}
.subs:empty{display:none}
.pill[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #22142b}
.pill:active{transform:translateY(2px)}
.pill svg{width:34px;height:34px;flex:none;padding:3px;border-radius:50%;background:#fff}

.opts{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding:4px 2px 16px;margin:0 -2px}
.credit{flex:none;margin:-6px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);text-align:center;font:700 12px/1.3 var(--font-body);color:var(--ink-soft)}
.opts>.credit{margin:auto 0 0;padding-top:4px}
.credit-copy{appearance:none;border:0;background:none;padding:6px 2px;margin:-6px 0;cursor:pointer;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--chip-edge);text-underline-offset:2px}
.copied{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:30;padding:5px 12px;border-radius:999px;background:rgba(61,39,72,.82);color:#fff;font:700 12px/1.2 var(--font-body);white-space:nowrap;pointer-events:none;opacity:0;transform:translateX(-50%);transition:opacity .25s}
.copied.show{opacity:1}
.group{display:flex;flex-direction:column;gap:8px}
.gtitle{display:flex;align-items:center;gap:6px;font:800 13px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);padding-left:2px}
.gtitle svg{width:26px;height:26px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--sw) + 12px),1fr));gap:12px 6px}
.tile{appearance:none;border:0;background:none;padding:6px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:11px;color:var(--ink);font:800 12px/1.1 var(--font-body);min-width:0}
.tile .nm{max-width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{position:relative;width:var(--sw);height:var(--sw);border-radius:50%;display:grid;place-items:center;background:var(--chip);box-shadow:0 4px 0 var(--chip-edge),inset 0 -6px 10px rgba(61,39,72,.06);transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s;overflow:hidden}
.sw svg{width:82%;height:82%}
.sw.paint{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8) 0 9%,rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 120%,rgba(0,0,0,.14),rgba(0,0,0,0) 60%),var(--p)}
.tile[aria-pressed="true"] .sw{transform:scale(1.06);box-shadow:0 0 0 4px var(--tray),0 0 0 8px var(--cat-c),0 4px 0 var(--chip-edge)}
.tile:active .sw{transform:scale(.9)}
.tile.sticker .sw svg{width:74%;height:74%;filter:drop-shadow(0 2px 2px rgba(61,39,72,.22))}
.sizes{display:flex;gap:12px;align-items:flex-end}
.size{appearance:none;border:0;cursor:pointer;background:var(--chip);border-radius:20px;box-shadow:0 4px 0 var(--chip-edge);display:grid;place-items:center;width:72px;height:64px;transition:transform .12s}
.size i{display:block;border-radius:50%;background:var(--cat-c);transform:scale(1.4)}
.size:active{transform:translateY(3px)}
.size[aria-pressed="true"]{background:var(--ink)}
.size[aria-pressed="true"] i{background:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.act{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:52px;padding:10px 20px 9px 14px;border-radius:999px;background:var(--chip);box-shadow:0 4px 0 var(--chip-edge);font:700 18px/1 var(--font-display);color:var(--ink)}
.act svg{width:26px;height:26px}
.act:active{transform:translateY(3px)}
.act.warn{background:var(--ink);color:#fff;box-shadow:0 3px 0 #22142b}

.row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* ---------- Photos ---------- */
.snap{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(var(--ov) + 14px);z-index:3;appearance:none;border:0;cursor:pointer;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;box-shadow:0 5px 0 #d23c6c,0 10px 22px rgba(160,30,80,.28);transition:transform .12s}

.album{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(var(--ov) + 14px);z-index:3;appearance:none;border:0;cursor:pointer;width:68px;height:68px;padding:5px 5px 13px;border-radius:10px;background:#fff;transform:rotate(-6deg);box-shadow:0 4px 0 var(--chip-edge),0 8px 18px rgba(61,39,72,.18);transition:transform .15s}

.fly img{display:block;width:100%;height:100%;border-radius:4px}
.gal{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:rgba(61,39,72,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.gal-sheet{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--tray);border-radius:28px;box-shadow:0 20px 50px rgba(30,10,40,.35);overflow:hidden}
.gal-top{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 4px 20px;flex:none}
.gal-ttl{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--pink);color:#fff}
.gal-ttl svg{width:34px;height:34px}
.gal-grid{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;padding:14px 22px 28px;align-content:start}
.phc{position:relative;transform:rotate(var(--r,0deg))}
.ph{appearance:none;border:0;cursor:pointer;display:block;width:100%;background:#fff;padding:8px 8px 62px;border-radius:10px;box-shadow:0 4px 0 var(--chip-edge),0 8px 18px rgba(61,39,72,.12);transition:transform .15s}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;background:var(--stage)}

.ph-acts{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:14px;pointer-events:none}

.pa:active{transform:translateY(3px)}
.pa.go{background:#5cc98a;color:#fff;box-shadow:0 3px 0 #3a9d66}
.pa.warn{background:#ff4d6d;color:#fff;box-shadow:0 3px 0 #c42747}
.gal-view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:18px;background:var(--tray)}

function tone(f0,f1,dur,type,vol,delay){
  if(muted)return; const a=audio(); if(!a)return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.14,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.03);
}

function layout(){

  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2,Math.sqrt(2.8e6/(w*h))));renderer.setSize(w,h,false);

  const halfH=1.58,halfW=1.72;const d=Math.max(halfH/Math.tan(vf/2)*(h/eh),halfW/Math.tan(hf/2))*1.02;

    const target=k==='lashes'||k==='lashColor'||k==='eye'||k==='lens'||k==='shadow'?eyes[1].g:k==='horn'?hornG:k==='earring'||k==='earTop'?ears[1].g:k==='nose'||k==='lips'?muzzleMesh:k==='headAcc'||k==='hair'||k==='mane'?hornG:headMesh;
    const wp=new THREE.Vector3();target.getWorldPosition(wp);burst(wp.add(V3(0,0,.4)),7,.9);return;}
  const sp=e.target.closest('[data-scent]');if(sp){ui.scent=sp.dataset.scent;coachIdle=performance.now();showCoach(null);optsEl.querySelectorAll('[data-scent]').forEach(x=>x.setAttribute('aria-pressed',x===sp));hintSeen=false;updateHint();sfx.spray();const wp=nosePos();floatUp(wp,SCENT[ui.scent].tex,.3);return;}
  const st=e.target.closest('[data-stk]');if(st){ui.sticker=st.dataset.stk;coachIdle=performance.now();showCoach(null);optsEl.querySelectorAll('[data-stk]').forEach(x=>x.setAttribute('aria-pressed',x===st));hintSeen=false;updateHint();sfx.pop();return;}
  const sz=e.target.closest('[data-size]');if(sz){ui.size=sz.dataset.size;optsEl.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',x===sz));sfx.tab();return;}
  const a=e.target.closest('[data-act]');if(a){
    if(a.dataset.act==='undo'){const s=state.stickers.pop();if(s){paintBy[s.m]();save();sfx.undo();}clearArmed=0;}
    else if(a.dataset.act==='clear'){if(!clearArmed){clearArmed=1;setTimeout(()=>{clearArmed=0;refreshStickerActions();},3000);}else{clearArmed=0;state.stickers=[];paintHead();paintMuzzle();paintNeck();save();sfx.magic();squash(1);}}
    refreshStickerActions();
  }
});

/* HUD */
const btnSound=$('#btnSound'),btnReset=$('#btnReset'),btnFull=$('#btnFull');
function paintSound(){btnSound.innerHTML=muted?ICON.soundOff:ICON.soundOn;btnSound.setAttribute('aria-pressed',String(!muted));btnSound.setAttribute('aria-label',i18n(muted?'Activar sonido':'Silenciar'));}
btnSound.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem(KEY+'-mute',muted?'1':'0');}catch(e){}paintSound();sfx.tab();});
let resetArmed=0;
function paintReset(){btnReset.classList.toggle('confirm',!!resetArmed);btnReset.innerHTML=ICON.reset+(resetArmed?`<span>${i18n('¿Empezar de nuevo?')}</span>`:'');btnReset.setAttribute('aria-label',i18n(resetArmed?'Toca otra vez para empezar de nuevo':'Empezar de nuevo'));}
btnReset.addEventListener('click',()=>{
  if(!resetArmed){resetArmed=1;paintReset();setTimeout(()=>{resetArmed=0;paintReset();},3000);sfx.tab();return;}
  resetArmed=0;state=JSON.parse(JSON.stringify(DEFAULT));applyAll();save();renderOpts();paintReset();sfx.magic();squash(1.3);tYaw=0;tPitch=0;burst(V3(0,.4,.9),24,1.6);
});
$('#btnWand').addEventListener('click',()=>{
  const r=(arr,noneP)=>{const o=arr.filter(x=>!NONE.has(x.id));return Math.random()<(noneP||0)?arr[0].id:pick(o).id;};
  Object.assign(state,{fur:r(FUR),mane:r(MANE),hair:r(HAIR),horn:r(HORN),eye:r(EYE),lens:Math.random()<.4?'normal':r(LENS),lashes:r(LASHES),lashColor:Math.random()<.5?'negro':r(LASH_C),shadow:r(SHADOW,.15),blush:r(BLUSH,.15),freckles:r(FRECKLES,.5),lips:r(LIPS),earring:r(EARRING,.35),earTop:r(EAR_TOP,.6),nose:r(NOSE,.6),glasses:r(GLASSES,.65),headAcc:r(HEADACC,.4)});
  applyAll();save();renderOpts();sfx.magic();squash(1.3);burst(V3(0,.5,.9),26,1.7);
});
const fsEl=document.documentElement;
if((fsEl.requestFullscreen||fsEl.webkitRequestFullscreen)&&(document.fullscreenEnabled||document.webkitFullscreenEnabled))btnFull.hidden=false;
btnFull.addEventListener('click',()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{const p=(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl);if(p&&p.catch)p.catch(()=>{btnFull.hidden=true;});}}catch(e){btnFull.hidden=true;}});

/* ================= photos ================= */
const PHOTO_KEY=KEY+'-fotos', PHOTO_MAX=24, PHOTO_PX=640;
let photos=[];
try{const a=JSON.parse(localStorage.getItem(PHOTO_KEY)||'[]');if(Array.isArray(a))photos=a.filter(p=>p&&typeof p.img==='string'&&p.img.startsWith('data:image/'));}catch(e){}
function savePhotos(){
  while(true){
    try{localStorage.setItem(PHOTO_KEY,JSON.stringify(photos));return true;}
    catch(e){if(photos.length<=1)return false;photos.shift();}
  }
}
const btnSnap=$('#btnSnap'),btnAlbum=$('#btnAlbum'),gal=$('#gal'),galGrid=$('#galGrid'),galView=$('#galView'),galImg=$('#galImg');
btnSnap.innerHTML=ICON.camera;$('#galTtl').innerHTML=ICON.camera;$('#galClose').innerHTML=ICON.close;
const gIco={back:ICON.back,share:ICON.savePic,look:ICON.dress,del:ICON.trash};
galView.querySelectorAll('[data-g]').forEach(b=>b.innerHTML=gIco[b.dataset.g]);
function paintAlbum(){
  const last=photos[photos.length-1];btnAlbum.hidden=!last;
  if(last){$('#albumImg').src=last.img;$('#albumN').textContent=photos.length;}
}
function capture(){
  // Render now and read back in the same task: the drawing buffer is still intact, no preserveDrawingBuffer needed.
  renderer.render(scene,camera);
  const w=stage.clientWidth,h=stage.clientHeight,k=canvas.width/w;
  const ew=(w-ovx)*k,eh=(h-ovy)*k,side=Math.min(ew,eh);
  const c=document.createElement('canvas');c.width=c.height=PHOTO_PX;
  c.getContext('2d').drawImage(canvas,(ew-side)/2,(eh-side)/2,side,side,0,0,PHOTO_PX,PHOTO_PX);
  return c.toDataURL('image/jpeg',.84);
}
function flyTo(img){
  const from=stage.getBoundingClientRect(),to=btnAlbum.getBoundingClientRect();
  const sz=Math.min(from.width-ovx,from.height-ovy)*.6;
  const el=document.createElement('div');el.className='fly';el.innerHTML=`<img src="${img}" alt="">`;
  Object.assign(el.style,{left:(from.left+(from.width-ovx-sz)/2)+'px',top:(from.top+(from.height-ovy-sz)/2)+'px',width:sz+'px',height:(sz+12)+'px'});
  document.body.appendChild(el);
  const dx=to.left+to.width/2-(from.left+(from.width-ovx)/2),dy=to.top+to.height/2-(from.top+(from.height-ovy)/2),s=to.width/sz;
  const done=()=>{el.remove();btnAlbum.classList.remove('pop');void btnAlbum.offsetWidth;btnAlbum.classList.add('pop');};
  if(reduced||!el.animate){done();return;}
  el.animate([{transform:'rotate(0) scale(1)'},{transform:'rotate(-4deg) scale(1.04)',offset:.35},{transform:`translate(${dx}px,${dy}px) rotate(-10deg) scale(${s})`}],{duration:850,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=done;
}
btnSnap.addEventListener('click',()=>{
  let img;try{img=capture();}catch(e){return;}
  photos.push({id:Date.now().toString(36),t:Date.now(),img,look:JSON.parse(JSON.stringify(state))});
  if(photos.length>PHOTO_MAX)photos.shift();
  savePhotos();
  const f=$('#flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');
  sfx.shutter();squash(.7);btnAlbum.hidden=false;flyTo(img);
  setTimeout(paintAlbum,reduced?0:850);
});

let viewing=null,delArmed=0,gridDelArmed=null,gridDelTimer=0;
function renderGallery(){
  galGrid.innerHTML=photos.slice().reverse().map((p,i)=>`<div class="phc" style="--r:${[-3,2,-1.5,3,-2.5,1.5][i%6]}deg"><button class="ph" data-ph="${p.id}" aria-label="${i18n('Foto {n}',{n:photos.length-i})}"><img src="${p.img}" alt=""></button><div class="ph-acts"><button class="pa go" data-pa="share" data-id="${p.id}" aria-label="${i18n('Guardar foto en la tablet')}">${ICON.savePic}</button><button class="pa${gridDelArmed===p.id?' warn':''}" data-pa="del" data-id="${p.id}" aria-label="${i18n(gridDelArmed===p.id?'Toca otra vez para borrar':'Borrar foto')}">${gridDelArmed===p.id?ICON.check:ICON.trash}</button></div></div>`).join('');
}
function openGallery(){renderGallery();closeViewer();gal.hidden=false;$('#app').inert=true;sfx.tab();$('#galClose').focus();}
function closeGallery(){gal.hidden=true;$('#app').inert=false;closeViewer();(btnAlbum.hidden?btnSnap:btnAlbum).focus();}
function openViewer(p){viewing=p;galImg.src=p.img;galView.hidden=false;galGrid.inert=true;delArmed=0;paintDel();galView.querySelector('[data-g="back"]').focus();}
function closeViewer(){viewing=null;galView.hidden=true;galGrid.inert=false;}
function paintDel(){const b=galView.querySelector('[data-g="del"]');b.classList.toggle('warn',!!delArmed);b.innerHTML=delArmed?ICON.check:ICON.trash;b.setAttribute('aria-label',i18n(delArmed?'Toca otra vez para borrar':'Borrar foto'));}
function polaroid(p){
  return new Promise((res,rej)=>{
    const im=new Image();im.onload=()=>{
      const m=48,W=PHOTO_PX+m*2,H=PHOTO_PX+m+150,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
      g.fillStyle='#ffffff';g.fillRect(0,0,W,H);g.drawImage(im,m,m,PHOTO_PX,PHOTO_PX);
      const heart=(x,y,s,col)=>{g.save();g.translate(x,y);g.scale(s/100,s/100);g.translate(-50,-50);g.fillStyle=col;g.fill(new Path2D(HEART));g.restore();};
      const star=(x,y,s,col)=>{g.save();g.translate(x,y);g.scale(s/100,s/100);g.translate(-50,-50);g.fillStyle=col;g.fill(new Path2D(SPARK));g.restore();};
      const y=PHOTO_PX+m+75;
      heart(m+40,y,46,'#ff5d8f');star(m+96,y-14,30,'#ffc94d');heart(m+130,y+14,26,'#a17cf0');
      heart(W-m-40,y,46,'#ff5d8f');star(W-m-96,y-14,30,'#5cb8f5');heart(W-m-130,y+14,26,'#6fd68f');
      g.fillStyle='#3d2748';g.font='800 34px "Baloo 2","Chalkboard SE",system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
      g.fillText(new Date(p.t).toLocaleDateString(document.documentElement.lang||'es',{day:'numeric',month:'short',year:'numeric'}),W/2,y+4);
      c.toBlob(b=>b?res(b):rej(),'image/png');
    };im.onerror=rej;im.src=p.img;
  });
}
async function sharePhoto(p){
  let blob;try{blob=await polaroid(p);}catch(e){return;}
  const name=`unicornio-${new Date(p.t).toISOString().slice(0,10)}-${p.id}.png`;
  const file=typeof File==='function'?new File([blob],name,{type:'image/png'}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:i18n('Mi unicornio')});return;}catch(e){if(e&&e.name==='AbortError')return;}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}
btnAlbum.addEventListener('click',openGallery);
$('#galClose').addEventListener('click',()=>{closeGallery();sfx.tab();});
gal.addEventListener('click',e=>{if(e.target===gal)closeGallery();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!gal.hidden){if(viewing)closeViewer();else closeGallery();}});
function deletePhoto(p){photos=photos.filter(x=>x!==p);savePhotos();sfx.undo();paintAlbum();renderGallery();if(!photos.length)closeGallery();}
galGrid.addEventListener('click',e=>{
  const a=e.target.closest('[data-pa]');
  if(a){const p=photos.find(x=>x.id===a.dataset.id);if(!p)return;
    if(a.dataset.pa==='share'){sfx.pop();sharePhoto(p);return;}
    clearTimeout(gridDelTimer);
    if(gridDelArmed!==p.id){gridDelArmed=p.id;renderGallery();sfx.tab();galGrid.querySelector(`[data-pa="del"][data-id="${p.id}"]`).focus();gridDelTimer=setTimeout(()=>{gridDelArmed=null;if(!gal.hidden)renderGallery();},3000);return;}
    gridDelArmed=null;deletePhoto(p);return;}
  const b=e.target.closest('[data-ph]');if(!b)return;const p=photos.find(x=>x.id===b.dataset.ph);if(p){openViewer(p);sfx.pop();}});
galView.addEventListener('click',e=>{
  const b=e.target.closest('[data-g]');if(!b||!viewing)return;const act=b.dataset.g;
  if(act==='back'){closeViewer();sfx.tab();}
  else if(act==='share'){sfx.pop();sharePhoto(viewing);}
  else if(act==='look'){
    const def=JSON.parse(JSON.stringify(DEFAULT)),L=viewing.look||{};
    for(const k in CATALOG)if(CATALOG[k].some(o=>o.id===L[k]))def[k]=L[k];
    if(Array.isArray(L.stickers))def.stickers=JSON.parse(JSON.stringify(L.stickers));
    state=def;applyAll();save();renderOpts();closeGallery();sfx.magic();squash(1.3);burst(V3(0,.5,.9),26,1.7);
  }
  else if(act==='del'){
    if(!delArmed){delArmed=1;paintDel();sfx.tab();const p=viewing;setTimeout(()=>{if(viewing===p&&delArmed){delArmed=0;paintDel();}},3000);return;}
    const p=viewing;closeViewer();deletePhoto(p);
  }
});

/* ================= boot ================= */
paintSound();paintReset();paintAlbum();
applyAll();shadowAll(uni);
renderCats();renderSubs();renderOpts();updateHint();
layout();
requestAnimationFrame(frame);
window.__uni={state,apply,applyAll,ui,renderOpts,renderCats,renderSubs,camera,tap,hitTest};
})();
</script>
