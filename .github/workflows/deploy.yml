# Deploys the static site in public/ to Cloudflare Pages (no build step).
# main -> production (https://unicornia.pages.dev)
# pull requests -> preview URL per branch, linked from the PR's deployments
#                  and from a sticky PR comment updated on every push.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  PAGES_PROJECT: unicornia

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Forks and repos without the Cloudflare secrets skip the deploy.
      - name: Check Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "branch=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._/-' '-')" >> "$GITHUB_OUTPUT"
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Creates the Pages project on the first run; a no-op afterwards.
          preCommands: npx wrangler pages project create ${{ env.PAGES_PROJECT }} --production-branch=main || true
          command: pages deploy public --project-name=${{ env.PAGES_PROJECT }} --branch=${{ steps.secrets.outputs.branch }}

      - name: Summary
        if: steps.deploy.outcome == 'success'
        run: |
          echo "### Unicornia deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}" >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, edited in place on every push.
      - name: Comment preview URL on PR
        if: steps.deploy.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- unicornia-preview -->';
            const { ALIAS_URL, DEPLOY_URL, SHA } = process.env;
            const body = [
              marker,
              '### 🦄 Preview de Unicornia',
              '',
              `**Probar aquí:** ${ALIAS_URL || DEPLOY_URL}`,
              '',
              '| | |',
              '|---|---|',
              `| Rama (siempre la última versión) | ${ALIAS_URL || '—'} |`,
              `| Este commit (\`${SHA.slice(0, 7)}\`) | ${DEPLOY_URL} |`,
              `| Actualizado | ${new Date().toISOString().replace('T', ' ').slice(0, 16)} UTC |`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
